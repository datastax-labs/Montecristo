/*
 * This file was generated by the Gradle 'init' task.
 */
buildscript {
    ext.kotlin_version = '1.8.22'

    repositories {
        mavenCentral()
    }
    dependencies {
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath "com.netflix.nebula:gradle-ospackage-plugin:11.10.0"
        classpath 'com.github.jengelman.gradle.plugins:shadow:5.2.0'
    }
}
plugins {
    id 'java'
    id 'maven-publish'
    id 'idea'
    id 'application'
    id "org.jetbrains.kotlin.jvm" version "$kotlin_version"
    id "org.jetbrains.kotlin.kapt" version "$kotlin_version"
}
repositories {
    mavenCentral()
    maven { url "https://oss.sonatype.org/content/repositories/snapshots/" }
}
application {
    mainClass = "com.datastax.dsestatsconverter.ConvertKt"
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version"
    implementation "org.jetbrains.kotlin:kotlin-reflect:$kotlin_version"
    implementation 'org.slf4j:slf4j-api:1.7.36'
    implementation 'ch.qos.logback:logback-classic:1.3.14'
    implementation 'ch.qos.logback:logback-core:1.3.14'
    implementation 'commons-io:commons-io:2.17.0'
    
    // DSE runtime dependencies - extracted from DSE tarball by build.sh
    // Minimal set verified by iterative testing with SSTableMetadataViewer
    // Note: netty-all is just a POM aggregator, need all individual netty-*.jar modules
    implementation fileTree(dir: '.dse-libs', include: [
        'agrona-*.jar',
        'caffeine-*.jar',
        'commons-cli-*.jar',
        'commons-codec-*.jar',
        'commons-io-*.jar',
        'commons-lang3-*.jar',
        'commons-math3-*.jar',
        'dse-commons-*.jar',
        'dse-db-all-*.jar',
        'durian-*.jar',
        'guava-*.jar',
        'HdrHistogram-*.jar',
        'jamm-*.jar',
        'jctools-core-*.jar',
        'jna-*.jar',
        'joda-time-*.jar',
        'logback-classic-*.jar',
        'logback-core-*.jar',
        'metrics-core-*.jar',
        'netty-*.jar',
        'reactive-streams-*.jar',
        'rxjava-*.jar',
        'slf4j-api-*.jar',
        'stream-*.jar'
    ])
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.jetbrains.kotlin:kotlin-test:1.8.22'
    testImplementation 'org.assertj:assertj-core:3.26.3'
    testImplementation 'io.mockk:mockk:1.9.3.kotlin12'
}

group = 'com.datastax'
version = '0.1'

sourceCompatibility = '1.8'
targetCompatibility = '1.8'
assert JavaVersion.current().isJava8(): "Java 8 is required"

publishing {
    publications {
        maven(MavenPublication) {
            from(components.java)
        }
    }
}
compileKotlin {
    kotlinOptions.jvmTarget = "1.8"
    kotlinOptions.freeCompilerArgs = ["-Xallow-result-return-type"]
}
compileTestKotlin {
    kotlinOptions.jvmTarget = "1.8"
    kotlinOptions.freeCompilerArgs = ["-Xallow-result-return-type"]
}
kapt {
    // Correct issue when a module named 'system' exists in project.
    // Still broken as of Kotlin 1.4.21.
    // https://kotlinlang.org/docs/reference/kapt.html#non-existent-type-correction
    correctErrorTypes = true
}
tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}
installDist {
    if (project.hasProperty('installPath')) {
        destinationDir = file(installPath)
    }
}
wrapper {
    distributionType = Wrapper.DistributionType.ALL
}
