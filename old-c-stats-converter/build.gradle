/*
 * This file was generated by the Gradle 'init' task.
 */
buildscript {
    ext.kotlin_version = '1.8.22'

    repositories {
        mavenCentral()
    }
    dependencies {
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath "com.netflix.nebula:gradle-ospackage-plugin:11.10.0"
        classpath 'com.github.jengelman.gradle.plugins:shadow:5.2.0'
    }
}
plugins {
    id 'java'
    id 'maven-publish'
    id 'idea'
    id 'application'
    id "org.jetbrains.kotlin.jvm" version "$kotlin_version"
    id "org.jetbrains.kotlin.kapt" version "$kotlin_version"
}
repositories {
    mavenCentral()
    maven { url "https://oss.sonatype.org/content/repositories/snapshots/" }
}
application {
    mainClass = "com.datastax.oldcstatsconverter.ConvertKt"
}

configurations.all {
    resolutionStrategy {
        // Force secure versions of transitive dependencies from cassandra-all
        force 'org.apache.cassandra:cassandra-all:3.11.19'
        // snakeyaml: Using 1.33 (latest 1.x) instead of 2.x due to API incompatibility.
        // Cassandra 3.11.19 uses CustomClassLoaderConstructor which has a different signature in snakeyaml 2.x,
        // causing NoSuchMethodError at runtime. This is a known limitation when using Cassandra 3.11.x.
        force 'org.yaml:snakeyaml:1.33'
        // lz4: Cassandra 3.11.19 requires net.jpountz.lz4:lz4:1.3.0 (old package structure).
        // Cannot upgrade to org.lz4:lz4-java due to incompatible package names (net.jpountz.lz4.* vs org.lz4.*).
        // No fix available for Cassandra 3.11.x.
        force 'io.netty:netty-all:4.1.132.Final'
        force 'org.apache.thrift:libthrift:0.20.0'
        force 'org.apache.httpcomponents:httpclient:4.5.14'
        // logback: 1.3.x is last Java 8 compatible version (1.4+ requires Java 11)
        force 'ch.qos.logback:logback-core:1.3.14'
        force 'ch.qos.logback:logback-classic:1.3.14'
        force 'org.apache.commons:commons-lang3:3.18.0'
        force 'org.apache.lucene:lucene-core:8.11.4'
        force 'org.apache.lucene:lucene-queryparser:8.11.4'
        // guava: Upgraded to 25.1-jre while maintaining Cassandra 3.11.19 compatibility.
        // Cassandra 3.11.x is not compatible with guava 27.x+ due to API changes (NoSuchFieldError: DIGIT).
        // This is the highest version confirmed compatible with Cassandra 3.11.x.
        // Transitive dependency from cassandra-all:3.11.19 (originally 18.0).
        force 'com.google.guava:guava:25.1-jre'
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version"
    implementation "org.jetbrains.kotlin:kotlin-reflect:$kotlin_version"
    implementation 'com.github.andrewoma.kwery:core:0.17'
    implementation 'org.xerial:sqlite-jdbc:3.46.1.3'
    implementation 'org.slf4j:slf4j-api:1.7.36'
    implementation 'ch.qos.logback:logback-classic:1.3.14'
    implementation 'ch.qos.logback:logback-core:1.3.14'
    implementation 'org.apache.commons:commons-csv:1.12.0'
    implementation 'org.yaml:snakeyaml:1.33'
    implementation 'io.netty:netty-all:4.1.132.Final'
    implementation 'org.apache.thrift:libthrift:0.20.0'
    implementation 'org.apache.httpcomponents:httpclient:4.5.14'
    implementation 'com.beust:jcommander:1.82'
    implementation 'com.github.spullara.mustache.java:compiler:0.9.14'
    implementation 'commons-io:commons-io:2.17.0'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.18.6'
    implementation "com.fasterxml.jackson.module:jackson-module-kotlin:2.18.6"
    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-yaml:2.18.6'
    implementation 'org.apache.cassandra:cassandra-all:3.11.19'
    // Transitive dependencies from cassandra-all (versions forced by resolutionStrategy above):
    implementation 'org.apache.commons:commons-lang3:3.18.0'
    implementation 'org.apache.lucene:lucene-core:8.11.4'
    implementation 'org.apache.lucene:lucene-queryparser:8.11.4'
    implementation 'com.beust:klaxon:5.5'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.jetbrains.kotlin:kotlin-test:1.8.22'
    testImplementation 'org.assertj:assertj-core:3.26.3'
    testImplementation 'io.mockk:mockk:1.9.3.kotlin12'
}

group = 'com.datastax'
version = '1.0.0'

sourceCompatibility = '1.8'
targetCompatibility = '1.8'
assert JavaVersion.current().isJava8(): "Java 8 is required"

publishing {
    publications {
        maven(MavenPublication) {
            from(components.java)
        }
    }
}
compileKotlin {
    kotlinOptions.jvmTarget = "1.8"
    kotlinOptions.freeCompilerArgs = ["-Xallow-result-return-type"]
}
compileTestKotlin {
    kotlinOptions.jvmTarget = "1.8"
    kotlinOptions.freeCompilerArgs = ["-Xallow-result-return-type"]
}
kapt {
    // Correct issue when a module named 'system' exists in project.
    // Still broken as of Kotlin 1.4.21.
    // https://kotlinlang.org/docs/reference/kapt.html#non-existent-type-correction
    correctErrorTypes = true
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}
installDist {
    if (project.hasProperty('installPath')) {
        destinationDir = file(installPath)
    }
}
wrapper {
    distributionType = Wrapper.DistributionType.ALL
}
